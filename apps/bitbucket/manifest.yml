app:
  id: ari:cloud:ecosystem::app/53a2efe5-9150-4e9a-b869-8bd2605d64e0
  runtime:
    name: nodejs22.x
  package:
    bundler: manual@2026
    path: dist
modules:
  bitbucket:mergeCheck:
    - key: redline-merge-check
      function: mergeCheck
      name: Redline security attestation
      description: Requires a valid Redline attestation for security-sensitive changes
      triggers: [ on-code-pushed, on-merge ]
  bitbucket:repoSettingsMenuPage:
    - key: redline-repo-settings
      title: Redline
      resource: settings
      resolver:
        function: settingsResolverFn
      render: default
  function:
    - key: mergeCheck
      handler: index.mergeCheck
    - key: settingsResolverFn
      handler: index.settingsResolver
resources:
  - key: settings
    path: ui/build
permissions:
  scopes:
    - read:pullrequest:bitbucket
    - read:repository:bitbucket
    - storage:app
