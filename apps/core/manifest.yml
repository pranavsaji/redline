app:
  id: ari:cloud:ecosystem::app/13898a7c-6897-48d3-a512-079d9f9f5f00
  runtime:
    name: nodejs22.x
  package:
    bundler: manual@2026
    path: dist
modules:
  sql:
    - key: main
      engine: mysql
  trigger:
    - key: on-install
      function: onInstall
      events: [ avi:forge:installed:app ]
  jira:issuePanel:
    - key: redline-panel
      resource: panel
      resolver:
        function: spikeResolver
      title: Redline security review
      icon: https://developer.atlassian.com/platform/forge/images/icons/issue-panel-icon.svg
  action:
    - key: ping
      name: Ping Redline
      function: pingFn
      actionVerb: GET
      description: Health check that returns the issue key it was given.
      inputs:
        issueKey:
          title: Issue key
          type: string
          required: true
          description: The Jira work item key
    - key: save-threat-model
      name: "Redline: save threat model"
      function: ingestThreatModelSpike
      actionVerb: CREATE
      description: Saves the Redline agent's threat model for a work item.
      config:
        resource: automation-config
        render: default
      inputs:
        issueKey:
          title: Issue key
          type: string
          required: true
          description: The Jira work item key
        agentResponse:
          title: Agent response
          type: string
          required: true
          description: The Redline agent's response
    - key: submit-threat-model
      name: Submit Redline threat model
      function: submitThreatModelFn
      actionVerb: CREATE
      description: Saves the Redline agent's threat model JSON for a Jira work item. Call this once with the full JSON.
      inputs:
        issueKey:
          title: Issue key
          type: string
          required: true
          description: The Jira work item key, e.g. PAY-1
        threatModel:
          title: Threat model JSON
          type: string
          required: true
          description: The complete threat model as a JSON string
  automation:actionProvider:
    - key: redline-automation
      actions: [ save-threat-model ]
  rovo:agent:
    - key: redline-reviewer
      name: Redline
      description: Security reviewer for Jira work items.
      prompt: You are Redline Security Reviewer. First call ping with the issue key you
        are given. Then call submit-threat-model with that issue key and threatModel set to
        the JSON string {"spike":true,"threats":[]}. Reply with both results.
      conversationStarters:
        - Ping PROJ-1
      actions: [ ping, submit-threat-model ]
  function:
    - key: onInstall
      handler: index.onInstall
    - key: submitThreatModelFn
      handler: index.submitThreatModelSpike
    - key: spikeResolver
      handler: index.spikeResolver
    - key: pingFn
      handler: index.ping
    - key: ingestThreatModelSpike
      handler: index.ingestThreatModelSpike
resources:
  - key: panel
    path: static/panel
  - key: automation-config
    path: static/automation-config
permissions:
  scopes:
    - read:jira-work
    - write:jira-work
    - storage:app
