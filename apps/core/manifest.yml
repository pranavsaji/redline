app:
  id: ari:cloud:ecosystem::app/13898a7c-6897-48d3-a512-079d9f9f5f00
  runtime:
    name: nodejs22.x
  package:
    bundler: manual@2026
    path: dist
modules:
  sql:
    - key: main
      engine: mysql
  trigger:
    - key: lifecycle
      function: lifecycleFn
      events: [ avi:forge:installed:app, avi:forge:upgraded:app ]
    - key: issue-events
      function: issueEventsFn
      events: [ avi:jira:created:issue, avi:jira:updated:issue ]
      filter:
        ignoreSelf: true
    - key: page-events
      function: pageEventsFn
      events: [ avi:confluence:updated:page ]
  consumer:
    - key: redline-jobs-consumer
      queue: redline-jobs
      function: jobConsumerFn
  scheduledTrigger:
    - key: sweeper
      function: sweeperFn
      interval: fiveMinute
    - key: hourly
      function: hourlyFn
      interval: hour
    - key: daily
      function: dailyFn
      interval: day
  jira:issuePanel:
    - key: redline-panel
      resource: panel
      title: Redline security review
      icon: https://developer.atlassian.com/platform/forge/images/icons/issue-panel-icon.svg
  action:
    - key: get-review-context
      name: Get Redline review context
      function: getReviewContextFn
      actionVerb: GET
      description: Returns the work item's security review context (design, linked work, pages, incidents) and the JSON output contract. Call this first when reviewing a work item.
      inputs:
        issueKey:
          title: Issue key
          type: string
          required: true
          description: The Jira work item key, for example PAY-7
    - key: submit-threat-model
      name: Submit Redline threat model
      function: submitThreatModelFn
      actionVerb: CREATE
      description: Saves the threat model JSON for a Jira work item as one agent run. Call this once with the complete JSON.
      inputs:
        issueKey:
          title: Issue key
          type: string
          required: true
          description: The Jira work item key, for example PAY-7
        submissionToken:
          title: Submission token
          type: string
          required: true
          description: The submissionToken returned by get-review-context for this same work item
        threatModelJson:
          title: Threat model JSON
          type: string
          required: true
          description: The complete threat model as a JSON string with "schema" set to "redline.threatmodel.v1"
  rovo:agent:
    - key: redline-reviewer
      name: Redline
      description: Security reviewer for Jira work items. Builds cited STRIDE threat models and explains what must be fixed before Done or merge.
      prompt: resource:agent-prompt;prompt.md
      conversationStarters:
        - What do I need to fix before PROJ-142 can merge?
        - Is release 4.2 safe to ship?
        - Which acceptances expire this month?
        - Explain threat T-7 like I'm new to security
      actions: [ get-review-context, submit-threat-model ]
  function:
    - key: lifecycleFn
      handler: index.lifecycleHandler
    - key: issueEventsFn
      handler: index.issueEventHandler
    - key: pageEventsFn
      handler: index.pageEventHandler
    - key: jobConsumerFn
      handler: index.jobConsumerHandler
      timeoutSeconds: 300
    - key: sweeperFn
      handler: index.sweeperHandler
    - key: hourlyFn
      handler: index.hourlyHandler
    - key: dailyFn
      handler: index.dailyHandler
    - key: getReviewContextFn
      handler: index.getReviewContextHandler
    - key: submitThreatModelFn
      handler: index.submitThreatModelHandler
resources:
  - key: panel
    path: static/panel
  - key: agent-prompt
    path: agent
permissions:
  scopes:
    read:jira-work:
      allowImpersonation: true
    write:jira-work: {}
    read:jira-user:
      allowImpersonation: true
    storage:app: {}
    read:confluence-content.summary: {}
    read:confluence-content.permission: {}
    read:page:confluence: {}
    write:page:confluence: {}
